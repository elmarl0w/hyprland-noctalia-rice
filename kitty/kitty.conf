# ─────────────────────────────────────────────
#  kitty — CachyOS Green
#  Цвета приходят из Noctalia (themes/noctalia.conf в конце файла)
# ─────────────────────────────────────────────

# ── Шрифт ────────────────────────────────────
font_family              MesloLGS Nerd Font
bold_font                auto
italic_font              auto
bold_italic_font         auto
font_size                12.0
disable_ligatures        never
modify_font              cell_height 105%

# ── Окно ─────────────────────────────────────
background_opacity       0.72
dynamic_background_opacity yes
window_padding_width     14
window_margin_width      0
hide_window_decorations  yes
confirm_os_window_close  0

# ── Курсор ───────────────────────────────────
cursor_shape             beam
cursor_beam_thickness    1.8
cursor_trail             1
cursor_blink_interval    0.6

# ── Вкладки: powerline со скосом, как в кадре ─
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         1
tab_bar_align            left
tab_title_template       "{index}  {title}"
active_tab_font_style    bold
inactive_tab_font_style  normal

# ── Прокрутка и звук ─────────────────────────
scrollback_lines         20000
enable_audio_bell        no
visual_bell_duration     0

# ── Прочее ───────────────────────────────────
allow_remote_control     yes
shell_integration        enabled
url_style                curly
copy_on_select           no


# ── Сочетания в стиле macOS ──────────────────
# После keyd: ⌘ = ctrl (большой палец), ⌃ = super (мизинец).
# ⌘ делает то, что делает приложение. ⌃ шлёт управляющие коды шелла.

clear_all_shortcuts yes

# ⌘ — приложение
map ctrl+c              copy_or_interrupt
map ctrl+v              paste_from_clipboard
map ctrl+shift+c        copy_to_clipboard
map ctrl+t              new_tab
map ctrl+w              close_tab
map ctrl+n              new_os_window
map ctrl+f              show_scrollback
map ctrl+plus           change_font_size all +1.0
map ctrl+equal          change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+0              change_font_size all 0
map ctrl+1              goto_tab 1
map ctrl+2              goto_tab 2
map ctrl+3              goto_tab 3
map ctrl+4              goto_tab 4
map ctrl+5              goto_tab 5
map ctrl+left           previous_tab
map ctrl+right          next_tab

# ⌃ — управляющие коды шелла, мизинцем как на маке
map super+c             send_text all \x03
map super+d             send_text all \x04
map super+z             send_text all \x1a
map super+r             send_text all \x12
map super+a             send_text all \x01
map super+e             send_text all \x05
map super+l             send_text all \x0c
map super+u             send_text all \x15
map super+k             send_text all \x0b
map super+w             send_text all \x17
map super+g             send_text all \x07
map super+p             send_text all \x10
map super+n             send_text all \x0e
map super+b             send_text all \x02
map super+f             send_text all \x06

include themes/noctalia.conf
