# ═══════════════════════════════════════════════════════════════
#  Раскладка модификаторов в стиле macOS.
#
#  Нижний ряд MX Keys Mini: Ctrl · Fn · Opt/Start · Cmd/Alt · Пробел
#  физически совпадает с маковским:  ⌃ · ⌥ · ⌘ · Пробел
#
#  Поворот трёх клавиш ставит каждой позиции её маковскую роль:
#
#     мизинец    Ctrl  -> Super    (⌃ на маке: рабочие столы)
#     средняя    Super -> Alt      (⌥ Option)
#     у пробела  Alt   -> Ctrl     (⌘ Command: копипаста)
#
#  Правая Cmd/Alt тоже становится Ctrl — на маке обе Command
#  работают одинаково. AltGr при этом теряется, но в раскладках
#  us и ru он ни за что не отвечает.
# ═══════════════════════════════════════════════════════════════

[ids]
*

[main]
leftalt     = leftcontrol
leftmeta    = leftalt
leftcontrol = leftmeta
rightalt    = rightcontrol
